<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <title>Survival Language Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dashboard" aria-label="Survival Language Dashboard">

    <!-- 1. Emergency Bar (Top) -->
    <section class="emergency" aria-label="Emergency Bar">
      <button id="emergencyBtn" class="emergency__btn" type="button">
        <span class="emergency__main">ちょっと待って</span>
        <span class="emergency__sub">翻訳機を使います</span>
      </button>
    </section>

    <!-- 2. Shop Utility (Center) -->
    <section class="shop" aria-label="Shop Utility">
      <header class="shop__header">
        <h2 class="shop__title">買い物・値段</h2>
        <div class="shop__lang">
          <label for="langSelect" class="shop__langLabel">現地の言葉</label>
          <select id="langSelect" class="shop__langSelect" aria-label="現地の言葉">
            <option value="en-US">English</option>
            <option value="zh-CN">中文 (普通话)</option>
            <option value="zh-TW">中文 (台灣)</option>
            <option value="ko-KR">한국어</option>
            <option value="th-TH">ไทย</option>
            <option value="vi-VN">Tiếng Việt</option>
            <option value="id-ID">Bahasa Indonesia</option>
            <option value="fr-FR">Français</option>
            <option value="es-ES">Español</option>
            <option value="it-IT">Italiano</option>
            <option value="de-DE">Deutsch</option>
          </select>
        </div>
      </header>

      <div class="shop__display" aria-live="polite">
        <span id="amountPrefix" class="shop__prefix">¥</span>
        <span id="amount" class="shop__amount">0</span>
      </div>

      <div class="shop__keypad" role="group" aria-label="数字キー">
        <button class="key" data-digit="1" type="button">1</button>
        <button class="key" data-digit="2" type="button">2</button>
        <button class="key" data-digit="3" type="button">3</button>
        <button class="key" data-digit="4" type="button">4</button>
        <button class="key" data-digit="5" type="button">5</button>
        <button class="key" data-digit="6" type="button">6</button>
        <button class="key" data-digit="7" type="button">7</button>
        <button class="key" data-digit="8" type="button">8</button>
        <button class="key" data-digit="9" type="button">9</button>
        <button class="key key--util" data-action="clear" type="button">C</button>
        <button class="key" data-digit="0" type="button">0</button>
        <button class="key key--util" data-action="back" type="button">⌫</button>
      </div>

      <div class="shop__quick" role="group" aria-label="よく使うフレーズ">
        <button class="quick" data-phrase="howmuch" type="button">
          <span class="quick__jp">これいくら？</span>
          <span class="quick__local" data-slot="howmuch">How much is this?</span>
        </button>
        <button class="quick" data-phrase="discount" type="button">
          <span class="quick__jp">安くして</span>
          <span class="quick__local" data-slot="discount">Can you give me a discount?</span>
        </button>
      </div>
    </section>

    <!-- 3. Connect Panel (Bottom) -->
    <section class="connect" aria-label="Connect Panel">
      <h2 class="connect__title">あいさつ</h2>
      <div class="connect__toggle" role="group" aria-label="あいさつ切替">
        <button class="greet" data-greet="morning" type="button">
          <span class="greet__icon" aria-hidden="true">☀</span>
          <span class="greet__jp">朝</span>
        </button>
        <button class="greet" data-greet="noon" type="button">
          <span class="greet__icon" aria-hidden="true">🌤</span>
          <span class="greet__jp">昼</span>
        </button>
        <button class="greet" data-greet="evening" type="button">
          <span class="greet__icon" aria-hidden="true">🌙</span>
          <span class="greet__jp">晩</span>
        </button>
        <button class="greet greet--thanks" data-greet="thanks" type="button">
          <span class="greet__icon" aria-hidden="true">♥</span>
          <span class="greet__jp">ありがとう</span>
        </button>
      </div>
      <div class="connect__output" id="greetOutput" aria-live="polite">
        ボタンを押すと現地の言葉で再生されます
      </div>
    </section>
  </main>

  <!-- Fullscreen overlay for Emergency mode -->
  <div id="emergencyOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="Please wait" hidden>
    <button id="overlayClose" class="overlay__close" type="button" aria-label="閉じる">×</button>
    <div class="overlay__content">
      <p class="overlay__big" id="overlayBig">Please wait a moment</p>
      <p class="overlay__sub" id="overlaySub">I'll use a translator.</p>
      <p class="overlay__hint">画面のどこでも触れて閉じる</p>
    </div>
  </div>

  <script src="phrases.js"></script>
  <script src="app.js"></script>
</body>
</html>
